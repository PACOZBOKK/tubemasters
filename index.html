<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15131f">
<meta name="description" content="Ouvre des boosters et collectionne les cartes des youtubeurs français.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TubeMasters">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>TubeMasters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : appli une-colonne façon tapis de jeu sombre, barre d'onglets en bas, cartes à collectionner au centre */
:root{
  color-scheme: dark;
  --bg:#12111a; --panel:#1c1a27; --panel2:#262335; --line:#363247;
  --fg:#f3f0fa; --muted:#a29cb8; --accent:#ff6a3d; --accent-ink:#1a0d07;
  --good:#4fd18b; --bad:#ff5d73;
  --r-c:#9a97a8; --r-u:#4fd18b; --r-r:#4aa8ff; --r-e:#b678ff; --r-l:#ffc53d;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#3a1f4a 0%,transparent 55%) fixed,var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;margin:0;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.wallet{display:flex;gap:8px;font-family:var(--f-mono);font-size:13px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip b{color:var(--accent)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;color:var(--muted);font:500 12px var(--f-body);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h2{font-size:24px;font-weight:800}
h3{font-size:16px;font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;font:700 15px var(--f-body);padding:12px 18px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters button{flex:none;background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}

/* Booster */
.booster-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0;position:relative}
.booster-stage::before{content:"";position:absolute;top:40px;left:50%;width:min(520px,140%);height:420px;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 45%,#ff3d7f38 0%,#7b4dff22 35%,transparent 65%);pointer-events:none;z-index:0}
.booster-stage > *{position:relative;z-index:1}
.pack-wrap{animation:float 4s ease-in-out infinite;padding:10px 0 18px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pack{width:200px;max-width:58vw;aspect-ratio:5/7.4;border:0;padding:0;background:none;cursor:pointer;container-type:inline-size;display:block;
  filter:drop-shadow(0 24px 30px #000a) drop-shadow(0 0 30px #ff3d7f55)}
.pack:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
[data-tilt]{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out;will-change:transform}
[data-tilt].tilting{transition:none}

/* Illustration du paquet (cqw = largeur du paquet) */
.pk{position:absolute;inset:0;border-radius:3cqw;overflow:hidden;color:#fff;font-family:var(--f-display)}
.pk-foil{position:absolute;inset:0;
  background:
   repeating-linear-gradient(60deg,#ffffff0e 0 1px,transparent 1px 7cqw),
   repeating-linear-gradient(-60deg,#ffffff0e 0 1px,transparent 1px 7cqw),
   radial-gradient(circle at 25% 18%,#ffb07a 0,transparent 38%),
   radial-gradient(circle at 85% 80%,#6a3cff 0,transparent 55%),
   linear-gradient(165deg,#ff5a2c 0%,#ff2d6f 42%,#c21f8a 66%,#4b23c8 100%)}
.pk-sheen{position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 38%,#ffffff66 47%,#ffe9c9aa 50%,#ffffff55 53%,transparent 62%);
  transform:translateX(-70%);animation:sheen 3.6s ease-in-out infinite;mix-blend-mode:soft-light}
@keyframes sheen{0%,35%{transform:translateX(-70%)}75%,100%{transform:translateX(70%)}}
.pk-glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),#ffffff55,transparent 45%);mix-blend-mode:overlay;opacity:.7}
.pk-crimp{position:absolute;left:0;right:0;height:8cqw;
  background:repeating-linear-gradient(90deg,#ffffff50 0 .6cqw,transparent .6cqw 2cqw),linear-gradient(180deg,#f2eefa,#a9a3bd 55%,#d8d3e6)}
.pk-crimp.t{top:0;-webkit-mask:conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) top/4cqw 2cqw repeat-x,linear-gradient(#000,#000) bottom/100% calc(100% - 2cqw) no-repeat;
  mask:conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) top/4cqw 2cqw repeat-x,linear-gradient(#000,#000) bottom/100% calc(100% - 2cqw) no-repeat}
.pk-crimp.b{bottom:0;-webkit-mask:conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/4cqw 2cqw repeat-x,linear-gradient(#000,#000) top/100% calc(100% - 2cqw) no-repeat;
  mask:conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/4cqw 2cqw repeat-x,linear-gradient(#000,#000) top/100% calc(100% - 2cqw) no-repeat}
.pk-ribbon{position:absolute;top:12cqw;left:0;right:0;display:flex;justify-content:center}
.pk-ribbon span{font:700 4.6cqw var(--f-mono);letter-spacing:.3em;padding:1.4cqw 3.6cqw 1.4cqw 4.2cqw;border-radius:99px;background:#0003;border:.5cqw solid #ffffff55}
.pk-emblem{position:absolute;top:24cqw;left:50%;width:50cqw;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:conic-gradient(from 20deg,#fff6d6,#e2a42a,#fff3b0,#9a5b0c,#ffe48a,#e2a42a,#fff6d6);box-shadow:0 0 0 1.4cqw #0002,0 2cqw 6cqw #0006,0 0 12cqw #ffcf6b66;display:grid;place-items:center}
.pk-emblem::before{content:"";position:absolute;inset:3.2cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a4d,#d81c55 60%,#7a0f45)}
.pk-emblem::after{content:"";position:absolute;inset:-12cqw;border-radius:50%;background:repeating-conic-gradient(#ffffff22 0 4deg,transparent 4deg 15deg);-webkit-mask:radial-gradient(circle,transparent 45%,#000 46%,transparent 72%);mask:radial-gradient(circle,transparent 45%,#000 46%,transparent 72%);animation:spin 18s linear infinite}
.pk-emblem i{position:relative;width:24cqw;height:17cqw;border-radius:5cqw;background:linear-gradient(180deg,#fff,#ffe1e8);box-shadow:0 1.2cqw 0 #8a0e3c}
.pk-emblem i::after{content:"";position:absolute;left:9.4cqw;top:4.6cqw;border-left:7.4cqw solid #e5195a;border-top:4cqw solid transparent;border-bottom:4cqw solid transparent}
.pk-logo{position:absolute;left:0;right:0;top:80cqw;text-align:center;line-height:.86}
.pk-logo small{display:block;font:600 8cqw var(--f-display);letter-spacing:.02em;font-style:italic;opacity:.95}
.pk-logo b{display:block;font:800 17cqw var(--f-display);letter-spacing:-.04em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 30%,#ffe08a 60%,#ffb33d);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .9cqw 0 #7a0f45) drop-shadow(0 0 4cqw #ffcf6b55)}
.pk-foot{position:absolute;left:0;right:0;bottom:12cqw;text-align:center;font:700 4.4cqw var(--f-mono);letter-spacing:.22em;opacity:.9}
.pk-foot::before{content:"";display:block;width:30cqw;height:.5cqw;margin:0 auto 2.6cqw;background:linear-gradient(90deg,transparent,#fff9,transparent)}

.stockbar{display:flex;gap:4px}
.stockbar i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.stockbar i.on{background:linear-gradient(90deg,var(--accent),#ff3d7f);box-shadow:0 0 6px #ff3d7f88}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;width:100%}

/* Carte TCG (cqw = largeur de la carte) : bordure métal de rareté, corps clair teinté par le type */
.card{--m1:#7d786c;--m2:#f6f1e4;--m3:#b8b1a0;--th:330;
  position:relative;aspect-ratio:5/7;max-width:100%;width:100%;display:block;border:0;cursor:pointer;color:#1b1622;text-align:left;font:inherit;
  box-sizing:border-box;container-type:inline-size;border-radius:4.6cqw;padding:3.4cqw;
  background:linear-gradient(135deg,var(--m1),var(--m2) 24%,var(--m3) 48%,var(--m2) 74%,var(--m1));
  box-shadow:0 2cqw 5cqw #0009,inset 0 0 0 .45cqw #ffffff55,inset 0 0 0 1.1cqw #00000014}
.card.r-U{--m1:#14603b;--m2:#c4f7da;--m3:#2fae6b}
.card.r-R{--m1:#173f86;--m2:#cfe8ff;--m3:#3a8be8}
.card.r-E{--m1:#4a1696;--m2:#f2d2ff;--m3:#9b55ff}
.card.r-L{--m1:#7a4306;--m2:#fff4b8;--m3:#e0a127;box-shadow:0 2cqw 5cqw #0009,0 0 8cqw #ffc53d66,inset 0 0 0 .45cqw #ffffff70}
.card .frame{position:relative;height:100%;box-sizing:border-box;border-radius:2.4cqw;overflow:hidden;display:flex;flex-direction:column;gap:1.3cqw;padding:2.2cqw 2.8cqw 1.8cqw;
  background:
    radial-gradient(circle at 18% 8%,#ffffff80,transparent 40%),
    repeating-linear-gradient(135deg,#ffffff1c 0 1.1cqw,transparent 1.1cqw 2.2cqw),
    linear-gradient(180deg,hsl(var(--th) 72% 84%),hsl(var(--th) 52% 66%));
  box-shadow:inset 0 0 0 .5cqw #00000030}
.card.r-L .frame{background:
    radial-gradient(circle at 18% 8%,#ffffffa0,transparent 40%),
    repeating-linear-gradient(135deg,#ffffff26 0 1.1cqw,transparent 1.1cqw 2.2cqw),
    linear-gradient(180deg,#fff1c4,hsl(var(--th) 55% 70%) 70%,#d9a640)}
.card .stage{font:700 3.3cqw/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#1b1622a8}
.card .head{display:flex;align-items:center;gap:1.4cqw;margin-top:-.4cqw}
.card .nm{flex:1;min-width:0;font:800 8.4cqw/1.05 var(--f-display);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hp{flex:none;display:flex;align-items:baseline;gap:.5cqw;font:800 7.6cqw/1 var(--f-display);color:#c0122f}
.card .hp small{font:700 3.4cqw var(--f-mono);color:#1b1622}
.orb{flex:none;width:8cqw;height:8cqw;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 34% 30%,hsl(var(--t) 92% 74%),hsl(var(--t) 72% 38%));box-shadow:0 .5cqw 0 #0005,inset 0 0 0 .45cqw #ffffff90}
.orb svg{width:62%;height:62%}
.orb.sm{width:5.4cqw;height:5.4cqw;box-shadow:0 .35cqw 0 #0004,inset 0 0 0 .35cqw #ffffff90}
.orb.cl{background:radial-gradient(circle at 34% 30%,#fff,#b9b3c4)}
.card .art{position:relative;flex:1;min-height:0;margin:.8cqw .4cqw .2cqw;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 .8cqw #f7ebc2,0 0 0 1.4cqw #6e5320,0 1.6cqw 2.4cqw #0005;
  background:radial-gradient(circle at 50% 115%,hsl(var(--h) 95% 65%) 0,transparent 55%),linear-gradient(165deg,hsl(var(--h) 75% 52%),hsl(calc(var(--h) + 45) 70% 26%))}
.card .art::before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 55%,#ffffff1c 0 7deg,transparent 7deg 18deg)}
.card .art::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 3cqw #0008;background:radial-gradient(circle at 50% 52%,#ffffff50 0 18%,transparent 40%)}
.card .art .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.card .art > svg{position:relative;z-index:1;width:46%;height:46%;color:#fff;filter:drop-shadow(0 1.4cqw 0 #0004) drop-shadow(0 0 4cqw #fff8)}
.card .art .hol{position:absolute;inset:0;z-index:3;mix-blend-mode:color-dodge;opacity:.55;pointer-events:none;
  background:linear-gradient(115deg,transparent 15%,#ff7ad9 30%,#ffe57a 40%,#7affc4 50%,#7ad4ff 60%,#c27aff 70%,transparent 85%);background-size:300% 300%;animation:holo 4s linear infinite}
.card.r-L .art::after{background:radial-gradient(circle at 50% 52%,#fff6 0 18%,transparent 40%),
  radial-gradient(circle at 20% 25%,#fff 0 1.2cqw,transparent 1.6cqw),radial-gradient(circle at 78% 30%,#fff 0 1cqw,transparent 1.4cqw),
  radial-gradient(circle at 70% 75%,#fff 0 .9cqw,transparent 1.3cqw),radial-gradient(circle at 30% 70%,#fff 0 .8cqw,transparent 1.2cqw);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.75}}
@keyframes holo{0%{background-position:100% 50%}100%{background-position:-100% 50%}}
.card .cap{margin:0 -2.8cqw;padding:.7cqw 2.8cqw;text-align:center;font:italic 600 3.4cqw/1.2 var(--f-body);color:#1b1622c8;
  background:linear-gradient(90deg,transparent,#ffffffa0 18%,#ffffffa0 82%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .moves{display:flex;flex-direction:column}
.card .mv{display:grid;grid-template-columns:13cqw 1fr auto;gap:1.6cqw;align-items:center;padding:1.3cqw .4cqw}
.card .mv + .mv{border-top:.35cqw solid #1b162230}
.card .cost{display:flex;flex-wrap:wrap;gap:.5cqw}
.card .an{min-width:0;font:800 5.4cqw/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dmg{font:800 7cqw/1 var(--f-display);font-variant-numeric:tabular-nums}
.card .wr{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;padding:1cqw 0;border-top:.35cqw solid #1b162240;border-bottom:.35cqw solid #1b162240}
.card .wr > div{display:flex;flex-direction:column;align-items:center;gap:.5cqw;font:700 2.9cqw/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:#1b1622a0}
.card .wr span{display:flex;align-items:center;gap:.5cqw;font:800 3.8cqw/1 var(--f-mono);color:#1b1622}
.card .flav{font:italic 500 3.4cqw/1.3 var(--f-body);color:#1b1622d0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .info{display:grid;grid-template-columns:auto 1fr;gap:2.4cqw;align-items:center;padding:1.8cqw 2cqw;border-radius:1.8cqw;background:#ffffff55;box-shadow:inset 0 0 0 .35cqw #1b162230}
.card .subs{display:flex;align-items:center;gap:1cqw;padding-right:2.4cqw;border-right:.35cqw solid #1b162230}
.card .subs b{font:800 9cqw/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.card .subs small{font:700 2.9cqw/1.15 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:#1b1622b0}
.card .info .flav{-webkit-line-clamp:3}
.card .art{margin-block:1cqw .4cqw}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:1cqw;font:700 3.1cqw/1 var(--f-mono);color:#1b1622b0;letter-spacing:.04em}
.card .set{display:inline-flex;align-items:center;gap:1cqw}
.card .set i{width:4.4cqw;height:3.1cqw;border-radius:.8cqw;background:#c0122f;position:relative}
.card .set i::after{content:"";position:absolute;left:1.6cqw;top:.75cqw;border-left:1.5cqw solid #fff;border-top:.8cqw solid transparent;border-bottom:.8cqw solid transparent}
.card .rs{font-size:3.8cqw;letter-spacing:-.05em;color:#1b1622}
.card.r-L .rs{color:#a86c00;text-shadow:0 0 1cqw #fff}
.card .cnt{position:absolute;z-index:6;top:-1.5cqw;right:-1.5cqw;font:800 6cqw/1 var(--f-mono);background:#15131f;color:#fff;padding:1.4cqw 2.6cqw;border-radius:99px;box-shadow:0 0 0 .6cqw var(--m2)}
.card .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;opacity:0;transition:opacity .2s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),#ffffff70,transparent 50%);mix-blend-mode:overlay}
.tilting .glare,.tilting.card .glare{opacity:1}
.card.holo .frame::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;mix-blend-mode:overlay;opacity:.35;
  background:linear-gradient(115deg,transparent 25%,#ffffffaa 45%,#ffe57a88 50%,transparent 65%);background-size:300% 300%;animation:holo 5s linear infinite}


/* Dos de carte */
.cback{box-sizing:border-box;position:relative;aspect-ratio:5/7;width:100%;border-radius:5cqw;container-type:inline-size;padding:3cqw;display:block;border:0;cursor:pointer;
  background:linear-gradient(135deg,#3b3456,#8f86b0 30%,#4a4268 55%,#8f86b0 80%,#3b3456);box-shadow:0 2cqw 5cqw #0008}
.cback .cb{height:100%;border-radius:3cqw;display:grid;place-items:center;position:relative;overflow:hidden;
  background:repeating-linear-gradient(45deg,#ffffff08 0 2cqw,transparent 2cqw 4cqw),radial-gradient(circle at 50% 45%,#5b2bd6 0,#241a45 55%,#120e22)}
.cback .cb::before{content:"";width:44cqw;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 20deg,#fff6d6,#e2a42a,#fff3b0,#9a5b0c,#ffe48a,#e2a42a,#fff6d6);box-shadow:0 0 10cqw #ffcf6b55}
.cback .cb::after{content:"?";position:absolute;font:800 22cqw var(--f-display);color:#e5195a;text-shadow:0 1cqw 0 #fff}
.cback.locked{cursor:default;filter:grayscale(.7) brightness(.6)}
.cback .lbl{position:absolute;bottom:7cqw;left:0;right:0;text-align:center;font:700 5.4cqw var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#fffc;z-index:1}

/* Ouverture de booster */
.opening{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 45%,#2a2140 0%,#0b0a10 70%);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.opening .hint{position:absolute;bottom:calc(32px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
.opening .rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;transform:translate(-50%,-50%) scale(0);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--burst) 0 6deg,transparent 6deg 18deg);opacity:0;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
.opening.burst .rays{animation:rays 1.6s ease-out forwards, spin 8s linear infinite}
@keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}30%{opacity:.9}100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}}
@keyframes spin{to{rotate:360deg}}
.opening .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.opening.burst .flash{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.bigpack{position:relative;width:min(240px,58vw);aspect-ratio:5/7.4;container-type:inline-size;filter:drop-shadow(0 30px 40px #000c)}
.bigpack .half{position:absolute;inset:0}
.opening.shaking .bigpack{animation:wobble 2.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-8px)}}
@keyframes bigshake{0%,100%{transform:none}15%{transform:rotate(-5deg) scale(1.02)}30%{transform:rotate(5deg) scale(1.04)}45%{transform:rotate(-6deg) scale(1.06)}60%{transform:rotate(6deg) scale(1.08)}75%{transform:rotate(-3deg) scale(1.1)}}
.opening.torn .tp{animation:tear .6s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes tear{to{transform:translate(70px,-180px) rotate(28deg);opacity:0}}
.opening.torn .bt{animation:drop .8s .5s ease-in forwards}
@keyframes drop{to{transform:translateY(120vh) rotate(-8deg)}}
.opening .fly{position:absolute;left:50%;top:45%;width:min(110px,26vw);margin-left:calc(min(110px,26vw)/-2);margin-top:calc(min(110px,26vw)*-0.7);
  opacity:0;transform:translateY(40px) scale(.6)}
.opening.torn .fly{animation:fly .7s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(.35s + var(--i) * .09s)}
@keyframes fly{to{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(1)}}

.flip{perspective:900px}
.flip .face{transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;position:relative;aspect-ratio:5/7}
.flip .face > *{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;inset:0}
.flip .back{transform:rotateY(180deg)}
.flip.down .face{transform:rotateY(180deg)}
.flip.down:hover .face{transform:rotateY(180deg) translateY(-4px)}
.flip.pop .card{animation:pop .45s .35s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.flip.glow-l .face{filter:drop-shadow(0 0 16px var(--r-l))}
.flip.glow-e .face{filter:drop-shadow(0 0 12px var(--r-e))}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.progress{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

/* Enchères */
.lot{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.lot .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.lot .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lot .bid{font:700 15px var(--f-mono)}
.lot .who{font-size:12px;color:var(--muted)}
.lot .lead{color:var(--good)} .lot .out{color:var(--bad)}
.tag{font:700 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--muted)}

/* Duel */
.hp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.hpbar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .4s}
.hpbar.foe i{background:var(--bad)}
.q{font:600 18px var(--f-display);line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 10px;font:500 14px var(--f-body);cursor:pointer;text-align:left;min-width:0;overflow-wrap:anywhere}
.opts button.ok{border-color:var(--good);background:#4fd18b22}
.opts button.ko{border-color:var(--bad);background:#ff5d7322}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.duo .vs{font:800 22px var(--f-display);color:var(--accent)}

/* Classement */
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}

/* Modale */
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(380px,100%);max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}

.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);text-align:right}
input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px;font:500 15px var(--f-mono);width:120px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:12px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.note{font-size:12px;color:var(--muted);line-height:1.45}
/* Ouverture : pile de cartes révélées une à une */
.ostack{position:absolute;left:50%;top:44%;width:min(250px,62vw);aspect-ratio:5/7;transform:translate(-50%,-50%);pointer-events:none}
.oc{position:absolute;inset:0;opacity:0;transform:translateY(60px) scale(.5);transition:transform .55s cubic-bezier(.2,.9,.3,1.15),opacity .3s}
.opening.stacked .oc{opacity:1;transform:translate(calc(var(--k) * 3px),calc(var(--k) * -3px)) rotate(calc((var(--k) - 2) * 1.5deg))}
.opening.stacked .oc.cur{transform:scale(1.04);z-index:20!important}
.opening .oc.out{transform:translate(-130vw,-10vh) rotate(-22deg)!important;opacity:0;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s .1s}
.oc .face{width:100%}
.oc.cur.flip .face{animation:none}
.oc .otag{position:absolute;left:-20%;right:-20%;top:calc(100% + 18px);display:flex;justify-content:center;gap:8px;flex-wrap:wrap;opacity:0;transition:opacity .3s .35s}
.oc.cur .otag{opacity:1}
.oc .rname{font:800 20px var(--f-display);letter-spacing:-.01em;text-shadow:0 0 18px currentColor}
.newb,.holob{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;align-self:center}
.newb{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 14px #ff6a3d88}
.holob{background:linear-gradient(90deg,#ff7ad9,#ffe57a,#7affc4,#7ad4ff);color:#1a0d07}
.opening.packgone .bigpack{visibility:hidden}
.opening.big-L .oc.cur .face{filter:drop-shadow(0 0 28px var(--r-l)) drop-shadow(0 0 60px var(--r-l))}
.opening.big-E .oc.cur .face{filter:drop-shadow(0 0 22px var(--r-e))}
.opening.big-L .oc.cur{animation:shakeL .5s .5s}
@keyframes shakeL{25%{translate:-4px 0}50%{translate:4px 0}75%{translate:-2px 0}}
.opening .ocount{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:700 13px var(--f-mono);letter-spacing:.2em;color:var(--muted)}
.opening.recap{place-items:start center;overflow-y:auto;background:radial-gradient(circle at 50% 0%,#3a1f4a 0%,#0b0a10 70%)}
.rec{width:min(640px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:18px;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media (max-width:420px){.rec-grid{grid-template-columns:1fr 1fr}}
.rec-grid .pull{animation:dealin .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--k) * .08s)}
@keyframes dealin{from{opacity:0;transform:translateY(30px) scale(.9)}}

/* ===== Refonte interface v2 ===== */

.hpbar.foe{display:flex}
.result.win{border-color:#4fd18b66;background:linear-gradient(180deg,#4fd18b1f,#1a1727)}
.result.lose{border-color:#ff5d7355}
.result .row .btn{flex:1 1 180px}
.cback.locked{cursor:pointer}
/* Bandeau « Ajouter à l'écran d'accueil » */
#install{padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inst{position:relative;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 40px 12px 12px;border-radius:16px;
  background:linear-gradient(#1f1b2e,#1f1b2e) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 10px 26px -16px #ff3d7f}
.inst .ico{width:44px;height:44px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 12px #ff3d7f55}
.inst .ico::after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.inst b{display:block;font:800 15px/1.25 var(--f-display);letter-spacing:-.01em}
.inst ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);line-height:1.35}
.inst li{display:flex;gap:7px;align-items:baseline}
.inst li i{flex:none;width:17px;height:17px;border-radius:50%;background:#ffffff14;color:var(--fg);font:700 10px/17px var(--f-mono);text-align:center;font-style:normal}
.inst li em{font-style:normal;color:var(--fg);font-weight:600}
.inst .shr{display:inline-block;width:14px;height:14px;vertical-align:-2px;color:#4aa8ff}
.inst .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:#ffffff10;color:var(--muted);cursor:pointer;font-size:13px}
.inst .btn{margin-top:8px;padding:9px 14px;font-size:14px}
.inst .more{background:none;border:0;padding:0;margin-top:6px;color:var(--accent);font:600 13px var(--f-body);cursor:pointer}
/* Cartes v3 : pas de cadre coloré, teinte unique par rareté (corps, illustration, pastille) */
.card{padding:0;border-radius:2.6cqw;background:none;box-shadow:0 2cqw 5cqw #0009}
.card.r-C{--b1:#f3f1f7;--b2:#cbc6d6;--a1:#9a95ad;--a2:#4a4560;--o1:#e4e0ec;--o2:#7a748e}

.card[class*="r-"] .frame{border-radius:2.6cqw;padding:2.8cqw 3.2cqw 2.2cqw;
  background:radial-gradient(circle at 18% 6%,#ffffff90,transparent 42%),repeating-linear-gradient(135deg,#ffffff1e 0 1.1cqw,transparent 1.1cqw 2.2cqw),linear-gradient(180deg,var(--b1),var(--b2));

.card .art{background:radial-gradient(circle at 50% 110%,#ffffff55 0,transparent 55%),linear-gradient(165deg,var(--a1),var(--a2));

function rollRarity(minU){ const ks=minU?ORDER.filter(k=>k!=="C"):ORDER; let x=Math.random()*ks.reduce((a,k)=>a+RAR[k].w,0);
  for(const k of ks){ if((x-=RAR[k].w)<0) return k; } return ks[ks.length-1]; }
function drawCard(theme,minU){ let r=rollRarity(minU), pool=CARDS.filter(c=>c.r===r);

  return {id:pick(pool).id,holo:Math.random()<0.06}; }

function tick(){
  const now=Date.now();
  if(S.stock>=MAXSTOCK){ S.lastRegen=now; }
  else { while(now-S.lastRegen>=REGEN && S.stock<MAXSTOCK){ S.stock++; S.lastRegen+=REGEN; } }
  marketTick(now);
  $("#likes").textContent=S.likes.toLocaleString("fr-FR");
  $("#stockTop").textContent=S.stock;
  if(lastStock!==null && S.stock!==lastStock && current==="boosters" && !document.querySelector(".opening")) render();
  lastStock=S.stock;
  const cd=$("#cd"); if(cd) cd.textContent = S.stock>=MAXSTOCK?"Stock plein":mmss(REGEN-(now-S.lastRegen));
  document.querySelectorAll("[data-end]").forEach(el=>{ el.textContent=mmss(+el.dataset.end-now); });
  save();
}

// ---------- Marché ----------
function newLot(){ const {id,holo}=drawCard(); const v=value(id,holo);
  return {k:Math.random().toString(36).slice(2,9),id,holo,price:Math.round(v*(0.4+Math.random()*0.4)),bidder:pick(BOTS),
    end:Date.now()+(2+Math.random()*12)*60000,myBid:0}; }
function marketTick(now){
  while(S.market.length<6) S.market.push(newLot());
  let changed=false;
  S.market.forEach(l=>{
    if(now<l.end && Math.random()<0.04 && l.price<value(l.id,l.holo)*1.6){
      if(l.bidder==="moi"){ S.likes+=l.myBid; toast(`Surenchère sur ${BY[l.id].name} !`); l.myBid=0; }
      l.price=Math.ceil(l.price*(1.08+Math.random()*0.1)); l.bidder=pick(BOTS); changed=true;
    }
  });
  const done=S.market.filter(l=>now>=l.end);
  done.forEach(l=>{ if(l.bidder==="moi"){ addCard(l.id,l.holo); toast(`Enchère gagnée : ${BY[l.id].name}`); } });
  if(done.length){ S.market=S.market.filter(l=>now<l.end); changed=true; }
  S.myLots.forEach(l=>{
    if(now<l.end && Math.random()<0.05 && l.price<value(l.id,l.holo)*1.4){ l.price=Math.ceil(l.price*(l.bidder?1.1:1)); l.bidder=pick(BOTS); changed=true; }
  });
  const sold=S.myLots.filter(l=>now>=l.end);
  sold.forEach(l=>{ if(l.bidder){ S.likes+=l.price; toast(`${BY[l.id].name} vendu ${l.price} ♥`); } else { addCard(l.id,l.holo); toast(`Aucune offre : ${BY[l.id].name} revient dans l'album`); } });
  if(sold.length){ S.myLots=S.myLots.filter(l=>now<l.end); changed=true; }
  if(changed && current==="encheres") render();
}

function nextBid(l){ return Math.ceil(l.price*1.1); }

function render(){ $("#view").innerHTML=views[current](); if(current==="boosters") setupCarousel(); }
function setupCarousel(){
  const car=$("#car"); if(!car) return;
  const slides=[...car.querySelectorAll(".slide")];
  const center=el=>el.offsetLeft+el.offsetWidth/2-car.clientWidth/2;
  car.scrollLeft=center(slides[selPack]);
  let raf=0;
  car.addEventListener("scroll",()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{
    const mid=car.scrollLeft+car.clientWidth/2; let best=0,bd=1e9;
    slides.forEach((s,i)=>{const d=Math.abs(s.offsetLeft+s.offsetWidth/2-mid); if(d<bd){bd=d;best=i;}});
    if(best!==selPack){ selPack=best;
      slides.forEach((s,i)=>{s.classList.toggle("on",i===best); const b=s.querySelector(".pack"); b.id=i===best?"pack":"";});
      document.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i===best));
      const ob=$("#openSel"); if(ob) ob.textContent="Ouvrir · "+PACKS[best].name; }
  });});
  slides.forEach((s,i)=>s.addEventListener("click",()=>{ if(i!==selPack) car.scrollTo({left:center(s),behavior:"smooth"}); }));
}
function go(tab){ current=tab; document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab)); render(); $("#view").scrollTop=0; }

// ---------- Booster ----------
function openPack(silent,theme=PACKS[selPack]){
  if(S.stock<1) return;
  if(S.stock>=MAXSTOCK) S.lastRegen=Date.now();
  S.stock--; S.opened++;
  const pulls=Array.from({length:5},(_,i)=>drawCard(theme,i===4));
  pulls.sort((a,b)=>ORDER.indexOf(BY[b.id].r)-ORDER.indexOf(BY[a.id].r) || a.holo-b.holo);
  const seen=new Set();
  lastPull=pulls.map(p=>{ const isNew=!S.owned[p.id] && !seen.has(p.id); seen.add(p.id); return {...p,isNew}; });
  pulls.forEach(p=>addCard(p.id,p.holo));
  tick();
  if(silent) return render();
  playOpening(theme);
}
function zig(top){
  const y=7.6, pts=[]; for(let i=0;i<=20;i++) pts.push(`${i*5}% ${y+(i%2?1.4:-1.4)}%`);
  return top?`polygon(0 0,100% 0,${pts.reverse().join(",")})`:`polygon(${pts.join(",")},100% 100%,0 100%)`;
}
const DWELL={C:1300,U:1500,R:2000,E:2600,L:3200};
function playOpening(theme=PACKS[0]){
  const pulls=lastPull, reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const best=BY[pulls[pulls.length-1].id].r;
  const ov=document.createElement("div");
  ov.className="opening"; ov.style.setProperty("--burst",RAR[best].c);
  ov.setAttribute("role","dialog"); ov.setAttribute("aria-label","Ouverture du booster");
  ov.innerHTML=`<div class="rays"></div>
    <div class="bigpack"><div class="half bt" style="clip-path:${zig(false)}">${packHTML(theme)}</div><div class="half tp" style="clip-path:${zig(true)}">${packHTML(theme)}</div></div>
    <div class="ostack">${pulls.map((p,i)=>`<div class="oc flip down" style="--k:${i};z-index:${10-i}" data-r="${BY[p.id].r}">
        <div class="face"><div>${cardHTML(p.id,{holo:p.holo})}</div><div class="back">${backHTML()}</div></div>
        <div class="otag">${p.isNew?`<span class="newb">Nouveau</span>`:""}${p.holo?`<span class="holob">Holo</span>`:""}<span class="rname" style="color:${RAR[BY[p.id].r].c}">${RAR[BY[p.id].r].name}</span></div>
      </div>`).join("")}</div>
    <div class="flash"></div>
    <div class="ocount" aria-live="polite"></div>
    <p class="hint">Touche le booster pour l'ouvrir</p>`;
  document.body.appendChild(ov);
  const cards=[...ov.querySelectorAll(".oc")], count=ov.querySelector(".ocount"), hint=ov.querySelector(".hint");
  let phase="shake", idx=-1, timer=null;
  const later=(fn,ms)=>{ clearTimeout(timer); timer=setTimeout(fn,reduce?Math.min(ms,300):ms); };
  const pulse=(color)=>{ ov.style.setProperty("--burst",color); ov.classList.remove("burst"); void ov.offsetWidth; ov.classList.add("burst"); };

  let lock=false;
  function tear(){
    phase="tear"; lock=true; hint.textContent="";
    ov.classList.remove("shaking"); ov.classList.add("torn"); pulse(RAR[best].c);
    later(()=>ov.classList.add("stacked"),350);
    later2(()=>{ lock=false; nextCard(); },1100);
  }
  let t2=null; function later2(fn,ms){ clearTimeout(t2); t2=setTimeout(fn,reduce?200:ms); }
  function nextCard(){
    ov.classList.add("stacked","packgone");
    if(idx>=0){ cards[idx].classList.add("out"); }
    idx++;
    if(idx>=cards.length) return recap();
    phase="card";
    const el=cards[idx], r=el.dataset.r;
    el.classList.add("cur"); el.classList.remove("down");
    count.textContent=`${idx+1} / ${cards.length}`;
    if(r==="L"||r==="E"){ pulse(RAR[r].c); ov.classList.add("big-"+r); try{ navigator.vibrate&&navigator.vibrate(r==="L"?[40,60,80]:40); }catch(e){} } else { ov.classList.remove("big-L","big-E"); }
    hint.textContent = idx===cards.length-1 ? "Touche pour voir le récap" : "Touche pour la carte suivante";
    // petit délai pour laisser la carte se retourner avant d'accepter le toucher suivant
    lock=true; setTimeout(()=>{ lock=false; }, reduce?100:450);
  }
  function recap(){
    phase="recap"; clearTimeout(timer); clearTimeout(t2);
    const nNew=pulls.filter(p=>p.isNew).length, total=pulls.reduce((a,p)=>a+value(p.id,p.holo),0);
    ov.classList.add("recap"); ov.style.cursor="default";
    ov.innerHTML=`<div class="rec">
      <div><h2>Ton booster</h2><p class="sub">${nNew?`${nNew} nouveau${nNew>1?"x":""} youtubeur${nNew>1?"s":""}`:"Aucun nouveau youtubeur"} · cote totale <b class="mono">${total.toLocaleString("fr-FR")} ♥</b></p></div>
      <div class="rec-grid">${pulls.map((p,i)=>`<div class="pull" style="--k:${i}">${cardHTML(p.id,{holo:p.holo})}${p.isNew?`<span class="newb">Nouveau</span>`:""}</div>`).join("")}</div>
      <div class="rec-act">
        <button class="btn" data-o="again" ${S.stock?"":"disabled"}>${S.stock?`Ouvrir un autre booster (${S.stock})`:"Plus de booster en stock"}</button>
        <button class="btn ghost" data-o="album">Voir l'album</button>
        <button class="btn ghost" data-o="close">Terminé</button>
      </div></div>`;
    ov.scrollTop=0; ov.querySelector(".rec .btn").focus({preventScroll:true});
  }
  function close(to){ ov.remove(); go(to||"boosters"); }
  ov.addEventListener("click",e=>{
    const o=e.target.closest("[data-o]");
    if(phase==="recap"){
      if(!o) return;
      if(o.dataset.o==="again"){ ov.remove(); render(); openPack(false,theme); return; }
      return close(o.dataset.o==="album"?"album":"boosters");
    }
    if(lock) return;
    if(phase==="shake") return tear();
    if(phase==="card") return nextCard();
  });
  ov.addEventListener("keydown",e=>{ if(e.key==="Escape"&&phase==="recap") close(); });
  requestAnimationFrame(()=>ov.classList.add("shaking"));
}

// ---------- Duel ----------
function makeQuestions(){
  const qs=[];
  const four=()=>shuffle(CARDS).slice(0,4);
  const t=[
    ()=>{const f=four(); const best=f.reduce((a,b)=>b.subs>a.subs?b:a); return {q:"Lequel a le plus d'abonnés ?",o:f.map(c=>c.name),a:f.indexOf(best)};},
    ()=>{const f=four(); const low=f.reduce((a,b)=>b.subs<a.subs?b:a); return {q:"Lequel a le moins d'abonnés ?",o:f.map(c=>c.name),a:f.indexOf(low)};},
    ()=>{const c=pick(CARDS); const cats=shuffle([...new Set(CARDS.map(x=>x.cat))].filter(x=>x!==c.cat)).slice(0,3); const o=shuffle([c.cat,...cats]); return {q:`Dans quelle catégorie joue ${c.name} ?`,o,a:o.indexOf(c.cat)};},
    ()=>{const c=pick(CARDS); const other=shuffle(CARDS.filter(x=>Math.abs(x.subs-c.subs)>1.5)).slice(0,3); const o=shuffle([c,...other]); return {q:`Qui compte environ ${fmtSubs(c.subs)} d'abonnés ?`,o:o.map(x=>x.name),a:o.indexOf(c)};},
    ()=>{const k=pick(["L","E"]); const c=pick(CARDS.filter(x=>x.r===k)); const other=shuffle(CARDS.filter(x=>x.r==="C"||x.r==="U")).slice(0,3); const o=shuffle([c,...other]); return {q:`Quelle carte est ${RAR[k].name.toLowerCase()} ?`,o:o.map(x=>x.name),a:o.indexOf(c)};}
  ];
  for(let i=0;i<5;i++) qs.push(t[i%t.length]());
  return shuffle(qs);
}
function startDuel(id){
  const today=new Date().toDateString(); if(S.duels.d!==today)S.duels={d:today,n:0};
  if(S.duels.n>=DUELS_PER_DAY){ toast("Plus de duels aujourd'hui, reviens demain"); return; }
  S.duels.n++;
  const myR=ORDER.indexOf(BY[id].r);
  const pool=CARDS.filter(c=>Math.abs(ORDER.indexOf(c.r)-myR)<=1);
  duel={me:id,meHolo:S.owned[id].h>0,foe:pick(pool).id,bot:pick(BOTS),hp:1500,fhp:1500,max:1500,qs:makeQuestions(),i:0,answered:null,msg:""};
  render();
}
function answer(i){
  const d=duel, Q=d.qs[d.i]; d.answered=i;
  const me=BY[d.me], foe=BY[d.foe], m=d.meHolo?1.1:1;
  const msgs=[];
  if(i===Q.a){ d.good=(d.good||0)+1; const dmg=Math.max(80,Math.round(me.atk*m-foe.def*0.5)); d.fhp=Math.max(0,d.fhp-dmg); msgs.push(`Bonne réponse : ${me.name} inflige ${dmg}.`); }
  else msgs.push("Raté.");
  if(Math.random()<0.6){ const dmg=Math.max(80,Math.round(foe.atk-me.def*m*0.5)); d.hp=Math.max(0,d.hp-dmg); msgs.push(`${d.bot} répond juste : ${foe.name} inflige ${dmg}.`); }
  else msgs.push(`${d.bot} se trompe.`);
  d.msg=msgs.join(" ");
  render();
}
function nextQ(){
  const d=duel; d.i++; d.answered=null; d.msg="";
  if(d.i>=5||d.hp<=0||d.fhp<=0){
    d.over = d.fhp<d.hp?"win":d.fhp===d.hp?"draw":"lose";
    if(d.over==="win"){S.likes+=60;S.wins++;}
  }
  render(); tick();
}

  if(t.closest("#revealAll")){ lastPull.forEach(p=>p.shown=true); return render(); }
  const fl=t.closest("[data-flip]"); if(fl){ const i=+fl.dataset.flip, p=lastPull[i], r=BY[p.id].r; p.shown=true; const el=fl.closest(".flip"); el.classList.remove("down"); el.classList.add("pop"); if(r==="L")el.classList.add("glow-l"); if(r==="E")el.classList.add("glow-e"); return; }
  const f=t.closest("[data-filter]"); if(f){ filter=f.dataset.filter; return render(); }
  const bid=t.closest("[data-bid]"); if(bid){
    const l=S.market.find(x=>x.k===bid.dataset.bid); if(!l) return;
    const amt=nextBid(l); if(S.likes<amt) return toast("Pas assez de likes");
    S.likes-=amt; l.price=amt; l.bidder="moi"; l.myBid=amt;
    if(l.end-Date.now()<30000) l.end=Date.now()+30000;
    tick(); return render();
  }
  const ans=t.closest("[data-ans]"); if(ans) return answer(+ans.dataset.ans);
  if(t.closest("#nextQ")) return nextQ();
  if(t.closest("#endDuel")){ duel=null; return render(); }
  if(t.closest("#again")){ const id=duel.me; duel=null; return startDuel(id); }
  if(t.closest("#reset")){ if(t.dataset.confirm){ S=fresh(); lastPull=null; duel=null; save(); tick(); return render(); } t.dataset.confirm="1"; t.textContent="Confirmer la réinitialisation"; return; }
  if(t.closest(".cback.locked")) return toast("Pas encore découvert");
  const c=t.closest("[data-card]");
  if(c){
    if(current==="duel" && !duel) return startDuel(c.dataset.card);
    if(current==="duel") return;
    if(c.closest(".lot")) return;
    return openCard(c.dataset.card);
  }
});
function onTilt(e){
  const el=e.target.closest&&e.target.closest("[data-tilt]"); if(!el||el.disabled) return;
  const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  el.classList.add("tilting"); el.style.setProperty("--ry",((x-.5)*22)+"deg"); el.style.setProperty("--rx",((.5-y)*22)+"deg");
  el.querySelectorAll(".card,.pk").forEach(n=>{n.style.setProperty("--gx",x*100+"%");n.style.setProperty("--gy",y*100+"%");});
  if(el.querySelector(".card")) el.querySelector(".card").classList.add("tilting");
}
function offTilt(e){ const el=e.target.closest&&e.target.closest("[data-tilt]"); if(!el) return;
  if(e.relatedTarget&&el.contains(e.relatedTarget)) return;
  el.classList.remove("tilting"); el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); el.querySelectorAll(".tilting").forEach(n=>n.classList.remove("tilting")); }
document.addEventListener("pointermove",onTilt);
document.addEventListener("pointerout",offTilt);
document.addEventListener("pointerup",e=>{ if(e.pointerType!=="mouse") offTilt(e); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

// Démarrage : une partie neuve commence avec un premier booster déjà tiré pour montrer le jeu
if(S.opened===0 && Object.keys(S.owned).length===0){ S.stock++; openPack(true); }
tick(); render();
setInterval(tick,1000);

// ---------- Données en direct (version en ligne sur Vercel) ----------
// La fonction /api/channels interroge l'API YouTube avec ta clé (gardée secrète côté serveur)
// et renvoie abonnés, photo et lien de chaque youtubeur. Ici, si elle n'existe pas, rien ne change.
async function loadLive(){
  try{
    const r=await fetch("/api/channels",{headers:{accept:"application/json"}});
    if(!r.ok) return;
    const data=await r.json(); if(!data||!data.channels) return;
    let n=0;
    for(const c of CARDS){
      const d=data.channels[c.name]; if(!d) continue;
      if(d.subs){ c.subs=d.subs/1e6; c.atk=Math.round(200+Math.sqrt(c.subs)*180); c.r=rarityOf(c.subs); }
      if(d.img) c.img=d.img;
      if(d.url) c.url=d.url;
      n++;
    }
    if(n) render();
  }catch(e){}
}
// ---------- Bandeau « Ajouter à l'écran d'accueil » ----------
// Visible seulement sur le site (pas dans un aperçu intégré), sur mobile, tant que l'appli n'est pas installée.
(function installBanner(){
  const el=$("#install"); if(!el) return;
  const standalone=matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
  let inFrame=false; try{ inFrame=window.top!==window; }catch(e){ inFrame=true; }
  let closed=false; try{ closed=localStorage.getItem("tm-install-closed")==="1"; }catch(e){}
  if(standalone||inFrame||closed) return;
  const ua=navigator.userAgent;
  const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const android=/Android/.test(ua);
  const share='<svg class="shr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 00-1 1v8a1 1 0 001 1h14a1 1 0 001-1v-8a1 1 0 00-1-1h-1"/></svg>';
  let deferred=null, open=false;
  function show(){
    let body;
    if(deferred) body=`<b>Installe TubeMasters</b><ol><li>Ajoute l'appli sur ton écran d'accueil pour l'ouvrir en plein écran, comme une vraie appli.</li></ol><button class="btn" data-i="install">Installer l'appli</button>`;
    else if(ios) body=`<b>Ajoute TubeMasters à ton écran d'accueil</b>`+(open?`<ol>
        <li><i>1</i><span>Dans Safari, touche <em>···</em> en bas à droite, ou l'icône <em>Partager</em> ${share}</span></li>
        <li><i>2</i><span>Touche <em>Partager</em> si besoin, puis fais défiler et choisis <em>Sur l'écran d'accueil</em></span></li>
        <li><i>3</i><span>Touche <em>Ajouter</em> : l'appli s'ouvre en plein écran depuis son icône</span></li></ol>`
        :`<ol><li>Ouvre-la en plein écran depuis une icône, comme une vraie appli.</li></ol><button class="more" data-i="more">Voir comment faire</button>`);
    else body=`<b>Ajoute TubeMasters à ton écran d'accueil</b>`+(open?`<ol>
        <li><i>1</i><span>Dans Chrome, touche le menu <em>⋮</em> en haut à droite</span></li>
        <li><i>2</i><span>Choisis <em>Ajouter à l'écran d'accueil</em> ou <em>Installer l'application</em></span></li>
        <li><i>3</i><span>Confirme : l'appli s'ouvre en plein écran depuis son icône</span></li></ol>`
        :`<ol><li>Ouvre-la en plein écran depuis une icône, comme une vraie appli.</li></ol><button class="more" data-i="more">Voir comment faire</button>`);
    el.innerHTML=`<div class="inst" role="region" aria-label="Installer l'appli"><span class="ico" aria-hidden="true"></span><div>${body}</div><button class="x" data-i="close" aria-label="Masquer">✕</button></div>`;
    el.hidden=false;
  }
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; show(); });
  window.addEventListener("appinstalled",()=>{ el.hidden=true; });
  el.addEventListener("click",async e=>{
    const b=e.target.closest("[data-i]"); if(!b) return;
    if(b.dataset.i==="close"){ el.hidden=true; try{ localStorage.setItem("tm-install-closed","1"); }catch(_){} }
    if(b.dataset.i==="more"){ open=true; show(); }
    if(b.dataset.i==="install"&&deferred){ deferred.prompt(); const r=await deferred.userChoice.catch(()=>({})); deferred=null; if(r.outcome==="accepted") el.hidden=true; else show(); }
  });
  if(ios||android) show();
})();

loadLive();
</script>
